name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy app config main.py

      - name: Compile application modules
        run: python -m compileall app config main.py

      - name: Verify application import
        run: python -c "import main"

      - name: Run deterministic tests
        run: python -m pytest -v --cov=app --cov=config --cov=main --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
